[package]
name = "walletcore"
version = "0.1.8"
edition = "2021"

[lib]
name = "monerowalletcore"
# rlib: Rust apps (nexawal-gpui). cdylib/staticlib: Swift/JNI FFI.
crate-type = ["rlib", "cdylib", "staticlib"]

[features]
# Never enabled in distributed artifacts. Requires WALLETCORE_DIAGNOSTICS=1 at runtime too.
diagnostic-logging = []
# Enable scanner micro-profiler plumbing (compile-time + runtime).
# Runtime toggle is controlled via env var: MONERO_WALLET_SCANNER_MICROPROF=1
scanner-microprof = []

# Forward monero-wallet's compile-time generators (precomputed tables) feature through walletcore
# so the xcframework build can enable it via CARGO_FEATURES.
compile-time-generators = ["monero-wallet/compile-time-generators"]

# Fork-only dependency feature wiring lives directly in this fork-mode manifest.
#
# We intentionally do NOT use a forwarding feature (like `walletcore-fork-features`) here, because
# the whole point of having `Cargo.fork.toml` is that it's only used in fork mode.

[dependencies]
monero-wallet = { git = "https://github.com/cacaosteve/monero-oxide", rev = "adb07b29ef16de148f8ba0a907a8b4391c46d9ea", package = "monero-wallet", features = ["std"] }
monero-seed = { git = "https://github.com/monero-oxide/monero-wallet-util", rev = "420570cf6dfa9c1cd1c6c8230eb6dbe9b8569a0f", package = "monero-seed", features = ["std"] }
monero-address = { git = "https://github.com/cacaosteve/monero-oxide", rev = "adb07b29ef16de148f8ba0a907a8b4391c46d9ea", package = "monero-address", features = ["std"] }
monero-ed25519 = { git = "https://github.com/cacaosteve/monero-oxide", rev = "adb07b29ef16de148f8ba0a907a8b4391c46d9ea", package = "monero-ed25519", features = ["std"] }
monero-interface = { git = "https://github.com/cacaosteve/monero-oxide", rev = "adb07b29ef16de148f8ba0a907a8b4391c46d9ea", package = "monero-interface", features = ["std"] }

# Upstream daemon RPC implementation + recommended HTTP transport (simple-request)
monero-daemon-rpc = { git = "https://github.com/cacaosteve/monero-oxide", rev = "adb07b29ef16de148f8ba0a907a8b4391c46d9ea", package = "monero-daemon-rpc", features = ["std"] }
monero-simple-request-rpc = { git = "https://github.com/cacaosteve/monero-oxide", rev = "adb07b29ef16de148f8ba0a907a8b4391c46d9ea", package = "monero-simple-request-rpc", features = ["webpki-roots"] }

# Required because we construct a lightweight runtime (Runtime::new + block_on) around upstream async daemon RPC.
# NOTE: `tokio::time::timeout` requires the time driver; without it, calling time APIs can panic/abort at runtime.
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "time"] }

sha3 = { version = "0.10", default-features = false, features = ["std"] }
zeroize = { version = "1.5", default-features = false, features = ["zeroize_derive", "std"] }
curve25519-dalek = { version = "4", default-features = false, features = ["alloc", "zeroize"] }
monero-io = { git = "https://github.com/cacaosteve/monero-oxide", rev = "adb07b29ef16de148f8ba0a907a8b4391c46d9ea", package = "monero-io", features = ["std"] }
monero-epee = { git = "https://github.com/cacaosteve/monero-oxide", rev = "adb07b29ef16de148f8ba0a907a8b4391c46d9ea", package = "monero-epee" }

# Locate Application Support / data directory for per-wallet log file writing
dirs = "5"

# Buf/BufMut traits used by cuprate-epee-encoding helpers in our debug tooling
bytes = "1"

# Portable storage (EPEE) encoder used to correctly construct monerod *.bin request bodies
# (e.g. /get_blocks_by_height.bin) instead of hand-rolling the binary format.
cuprate-epee-encoding = { git = "https://github.com/Cuprate/cuprate", rev = "52d958074bcb0e69fc251b4fde862b22730ea9a1", package = "cuprate-epee-encoding" }

once_cell = "1.19"
ureq = { version = "2", features = ["tls", "json"] }
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
rand = "0.8"
rayon = "1.12"

[target.'cfg(not(any(target_os = "ios", target_os = "tvos", target_os = "watchos")))'.dependencies]
zmq = "0.10"

[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"

[profile.release]
overflow-checks = false

[profile.dev]
overflow-checks = true
